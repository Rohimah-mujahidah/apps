<!DOCTYPE html>
<html lang="id" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tasbih Digital Modern & Fisik</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Import Font Digital untuk Tema Fisik -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        islamic: {
                            light: '#f0fdf4',
                            primary: '#059669',
                            dark: '#064e3b',
                            gold: '#d97706'
                        }
                    },
                    fontFamily: {
                        digital: ['"Share Tech Mono"', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        .transition-all-smooth { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .progress-ring__circle {
            transition: stroke-dashoffset 0.35s transform 0.3s;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
        .tap-effect:active { transform: scale(0.95); }
        ::-webkit-scrollbar { width: 0px; background: transparent; }

        /* Custom Styles for Physical Themes */
        .lcd-shadow { box-shadow: inset 0 4px 15px rgba(0,0,0,0.4); }
        .btn-3d-shadow { box-shadow: inset 0 5px 15px rgba(255,255,255,0.2), 0 10px 20px rgba(0,0,0,0.5); }
        .btn-3d-shadow:active { box-shadow: inset 0 5px 15px rgba(0,0,0,0.4), 0 5px 10px rgba(0,0,0,0.5); }
        
        .theme-physical-black { background: linear-gradient(145deg, #374151, #111827); border-color: #1f2937; }
        .theme-physical-wood { background: linear-gradient(145deg, #92400e, #451a03); border-color: #78350f; }
        .lcd-screen-bg { background-color: #9ea792; color: #1a1a1a; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 transition-colors duration-300 antialiased h-screen flex justify-center overflow-hidden">

    <!-- Mobile Container -->
    <main class="w-full max-w-md h-full flex flex-col relative bg-white dark:bg-slate-800 shadow-2xl overflow-y-auto">
        
        <!-- Header -->
        <header class="p-4 flex justify-between items-center border-b border-slate-100 dark:border-slate-700 bg-islamic-primary text-white shadow-sm z-20">
            <h1 class="text-lg font-bold tracking-wide flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 10 10 4 4 0 0 1-5-5 4 4 0 0 1-5-5"/></svg>
                Tasbih App
            </h1>
            <div class="flex gap-2 items-center">
                <select id="themeSelect" class="text-xs bg-white/20 text-white border border-white/30 rounded-lg p-1.5 focus:outline-none focus:ring-2 focus:ring-white/50 [&>option]:text-slate-800">
                    <option value="modern">Tema Modern</option>
                    <option value="fisik-hitam">Fisik (Hitam)</option>
                    <option value="fisik-kayu">Fisik (Kayu)</option>
                </select>
                <button id="btnSound" class="p-1.5 rounded-full hover:bg-white/20" title="Mode Suara">
                    <!-- Mode 1: Suara Klik (Default) -->
                    <svg id="iconSoundClick" class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
                    <!-- Mode 2: Suara Orang (Voice) -->
                    <svg id="iconSoundVoice" class="w-4 h-4 hidden" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
                    <!-- Mode 0: Mute -->
                    <svg id="iconSoundOff" class="w-4 h-4 hidden" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>
                </button>
            </div>
        </header>

        <!-- Content Area -->
        <div class="flex-1 p-5 flex flex-col gap-4 overflow-y-auto">
            
            <!-- Controls: Dzikir & Target -->
            <div class="bg-islamic-light dark:bg-slate-700/50 p-3 rounded-xl shadow-sm border border-islamic-primary/20">
                <div class="flex items-center justify-between gap-3">
                    <div class="flex-1">
                        <select id="dzikirSelect" class="w-full p-2 text-sm rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 focus:ring-1 focus:ring-islamic-primary appearance-none font-medium">
                            <option value="Subhanallah">Subhanallah</option>
                            <option value="Alhamdulillah">Alhamdulillah</option>
                            <option value="Allahu Akbar">Allahu Akbar</option>
                            <option value="La Ilaha Illallah">La Ilaha Illallah</option>
                        </select>
                    </div>
                    <div class="w-24">
                        <div class="flex items-center gap-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 rounded-lg p-1">
                            <span class="text-xs text-slate-500 pl-1 font-bold">🎯</span>
                            <input type="number" id="targetInput" value="33" min="1" class="w-full bg-transparent text-sm font-bold focus:outline-none text-center">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Main Tasbih Shell (Adapts to Theme) -->
            <div id="tasbihShell" class="transition-all-smooth relative flex flex-col items-center w-full max-w-[320px] mx-auto p-5 py-8 rounded-[3rem]">
                
                <!-- LCD Screen Area -->
                <div id="lcdScreen" class="transition-all-smooth relative w-full max-w-[220px] h-24 rounded-2xl mb-6 flex flex-col items-center justify-center z-10">
                    <span id="counterDisplay" class="transition-all-smooth text-6xl font-black mb-1 text-islamic-dark dark:text-white">0</span>
                    <span id="targetDisplayBox" class="transition-all-smooth text-xs font-medium px-4 py-1.5 rounded-full text-slate-500 dark:text-slate-400 bg-slate-100 dark:bg-slate-700/50">
                        Target: <span id="targetDisplay">33</span>
                    </span>
                </div>

                <!-- Interactive Area -->
                <div class="relative flex items-center justify-center w-[260px] h-[260px]">
                    <!-- SVG Circular Progress -->
                    <svg id="svgProgress" class="absolute inset-0 w-full h-full pointer-events-none transition-opacity duration-500" viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="2" class="text-slate-200 dark:text-slate-700" />
                        <circle id="progressCircle" cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" class="text-islamic-primary progress-ring__circle transition-colors duration-300 drop-shadow-md" />
                    </svg>

                    <!-- Physical Reset Button (Only Fisik Themes) -->
                    <button id="physicalResetBtn" class="hidden absolute right-0 top-2 w-10 h-10 rounded-full bg-red-600 border-2 border-red-800 shadow-[inset_0_2px_4px_rgba(255,255,255,0.3),0_4px_8px_rgba(0,0,0,0.5)] tap-effect active:shadow-[inset_0_2px_4px_rgba(0,0,0,0.5)] flex items-center justify-center z-20" title="Reset">
                        <span class="text-[11px] text-white font-bold tracking-tighter">RST</span>
                    </button>

                    <!-- Main Button -->
                    <button id="mainBtn" class="transition-all-smooth tap-effect relative flex items-center justify-center w-40 h-40 rounded-full outline-none focus:outline-none group z-10">
                        <!-- Ripple for modern theme -->
                        <div id="rippleEffect" class="absolute inset-0 rounded-full bg-islamic-primary opacity-0 group-active:opacity-10 transition-opacity duration-100 pointer-events-none"></div>
                    </button>
                </div>
            </div>

            <!-- Statistics Box -->
            <div class="mt-auto bg-slate-100 dark:bg-slate-800/80 rounded-2xl p-4 border border-slate-200 dark:border-slate-700">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-sm font-bold flex items-center gap-2">
                        <svg class="w-4 h-4 text-islamic-primary" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>
                        Statistik Zikir
                    </h3>
                    <button id="btnReset" class="text-xs font-semibold text-red-500 hover:text-red-700 dark:text-red-400 py-1 px-2 bg-red-50 dark:bg-red-900/20 rounded-md">
                        Reset Sesi
                    </button>
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <div class="text-center p-2 bg-white dark:bg-slate-700 rounded-xl shadow-sm">
                        <span class="block text-[10px] text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">Harian</span>
                        <span id="statDaily" class="text-lg font-black text-islamic-dark dark:text-white">0</span>
                    </div>
                    <div class="text-center p-2 bg-white dark:bg-slate-700 rounded-xl shadow-sm">
                        <span class="block text-[10px] text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">Pekanan</span>
                        <span id="statWeekly" class="text-lg font-black text-islamic-dark dark:text-white">0</span>
                    </div>
                    <div class="text-center p-2 bg-white dark:bg-slate-700 rounded-xl shadow-sm border border-islamic-primary/20">
                        <span class="block text-[10px] text-islamic-primary font-bold uppercase tracking-wider mb-1">Bulanan</span>
                        <span id="statMonthly" class="text-lg font-black text-islamic-primary">0</span>
                    </div>
                </div>
                <p class="text-[10px] text-center text-slate-400 mt-3 flex items-center justify-center gap-1">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    Data bulanan akan otomatis reset setiap tanggal 1
                </p>
            </div>
        </div>

        <!-- System Notification Modal -->
        <div id="notifModal" class="fixed inset-0 z-50 hidden items-center justify-center px-4">
            <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm"></div>
            <div class="bg-white dark:bg-slate-800 rounded-3xl p-6 w-full max-w-sm relative z-10 shadow-2xl transform scale-100">
                <div class="w-16 h-16 rounded-full bg-blue-100 dark:bg-blue-900/30 flex items-center justify-center mx-auto mb-4">
                    <svg class="w-8 h-8 text-blue-600 dark:text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                </div>
                <h3 id="notifTitle" class="text-xl font-bold text-center mb-2">Pemberitahuan</h3>
                <p id="notifText" class="text-center text-slate-500 dark:text-slate-400 mb-6 text-sm">Pesan</p>
                <button id="btnCloseNotif" class="w-full p-3 rounded-xl bg-islamic-primary text-white font-semibold hover:bg-islamic-dark transition-colors">Tutup</button>
            </div>
        </div>
    </main>

    <!-- JavaScript Logic with Firebase Storage -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- STATE & VARIABEL ---
        let appData = {
            count: 0,
            daily: 0,
            weekly: 0,
            monthly: 0,
            target: 33,
            lastDate: '',
            lastWeek: -1,
            lastMonth: -1,
            theme: 'modern',
            soundMode: 1 // 0: mute, 1: click, 2: voice
        };
        
        let db, auth, userDocRef;
        let saveTimeout = null;
        let isFirebaseReady = false;

        // --- ELEMEN DOM ---
        const els = {
            mainBtn: document.getElementById('mainBtn'),
            counterDisplay: document.getElementById('counterDisplay'),
            targetDisplay: document.getElementById('targetDisplay'),
            targetInput: document.getElementById('targetInput'),
            progressCircle: document.getElementById('progressCircle'),
            svgProgress: document.getElementById('svgProgress'),
            dzikirSelect: document.getElementById('dzikirSelect'),
            statDaily: document.getElementById('statDaily'),
            statWeekly: document.getElementById('statWeekly'),
            statMonthly: document.getElementById('statMonthly'),
            themeSelect: document.getElementById('themeSelect'),
            tasbihShell: document.getElementById('tasbihShell'),
            lcdScreen: document.getElementById('lcdScreen'),
            targetDisplayBox: document.getElementById('targetDisplayBox'),
            physicalResetBtn: document.getElementById('physicalResetBtn'),
            rippleEffect: document.getElementById('rippleEffect'),
            btnReset: document.getElementById('btnReset'),
            notifModal: document.getElementById('notifModal'),
            notifTitle: document.getElementById('notifTitle'),
            notifText: document.getElementById('notifText'),
            btnCloseNotif: document.getElementById('btnCloseNotif'),
            btnSound: document.getElementById('btnSound'),
            iconSoundClick: document.getElementById('iconSoundClick'),
            iconSoundVoice: document.getElementById('iconSoundVoice'),
            iconSoundOff: document.getElementById('iconSoundOff')
        };

        // --- DATE HELPERS ---
        function getWeekNumber(d) {
            d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay()||7));
            var yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
            return Math.ceil(( ( (d - yearStart) / 86400000) + 1)/7);
        }

        function checkAndResetDates(showNotification = true) {
            const now = new Date();
            const curMonth = now.getMonth();
            const curWeek = getWeekNumber(now);
            const curDate = now.toDateString();
            let changed = false;

            // Jika aplikasi baru pertama kali dibuka
            if (appData.lastMonth === -1) {
                appData.lastMonth = curMonth;
                appData.lastWeek = curWeek;
                appData.lastDate = curDate;
                return true;
            }

            // Cek Pergantian Bulan (Reset Semua sesuai permintaan)
            if (appData.lastMonth !== curMonth) {
                appData.count = 0;
                appData.daily = 0;
                appData.weekly = 0;
                appData.monthly = 0;
                
                if (showNotification) showNotif("Bulan Baru!", "Alhamdulillah kita memasuki bulan baru. Semua data statistik zikir telah direset secara otomatis.");
                changed = true;
            } else {
                // Cek Pekan & Hari
                if (appData.lastWeek !== curWeek) {
                    appData.weekly = 0;
                    appData.daily = 0;
                    changed = true;
                } else if (appData.lastDate !== curDate) {
                    appData.daily = 0;
                    changed = true;
                }
            }

            appData.lastMonth = curMonth;
            appData.lastWeek = curWeek;
            appData.lastDate = curDate;
            
            return changed;
        }

        // --- FIREBASE INIT ---
        const initFirebase = async () => {
            try {
                const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
                if (!firebaseConfig) { 
                    console.log("Menjalankan mode lokal/memori murni.");
                    initApp(); // Fallback
                    return; 
                }
                
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                onAuthStateChanged(auth, async (user) => {
                    if (user) {
                        const appId = typeof __app_id !== 'undefined' ? __app_id : 'tasbih-app';
                        userDocRef = doc(db, 'artifacts', appId, 'users', user.uid, 'data', 'tasbih_stats');
                        isFirebaseReady = true;
                        
                        // Load data
                        const docSnap = await getDoc(userDocRef);
                        if (docSnap.exists()) {
                            appData = { ...appData, ...docSnap.data() };
                            // Setel UI sesuai data tersimpan
                            els.targetInput.value = appData.target;
                            els.themeSelect.value = appData.theme;
                        }
                        
                        initApp(); // Mulai aplikasi setelah data dimuat
                    }
                });
            } catch (e) { 
                console.error("Gagal init database:", e);
                initApp(); // Fallback
            }
        };

        // --- CORE FUNCTIONS ---
        function saveToCloud() {
            if (!isFirebaseReady || !userDocRef) return;
            // Debounce save (tunggu 1 detik setelah tap terakhir sebelum menyimpan ke server)
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(async () => {
                try {
                    await setDoc(userDocRef, appData, { merge: true });
                } catch (e) { console.error("Gagal menyimpan:", e); }
            }, 1000);
        }

        function updateUI() {
            // Update Teks
            els.counterDisplay.innerText = appData.count;
            els.targetDisplay.innerText = appData.target;
            els.statDaily.innerText = appData.daily;
            els.statWeekly.innerText = appData.weekly;
            els.statMonthly.innerText = appData.monthly;

            // Update Progress Circle (Hanya relevan di tema modern)
            if (appData.theme === 'modern') {
                const radius = els.progressCircle.r.baseVal.value;
                const circumference = radius * 2 * Math.PI;
                els.progressCircle.style.strokeDasharray = `${circumference} ${circumference}`;
                
                let percent = (appData.count / appData.target) * 100;
                if (percent > 100) percent = 100;
                
                const offset = circumference - (percent / 100) * circumference;
                els.progressCircle.style.strokeDashoffset = offset;

                // Warna emas & glow dinamis jika target tercapai
                if (appData.count >= appData.target && appData.target > 0) {
                    els.progressCircle.classList.remove('text-islamic-primary');
                    els.progressCircle.classList.add('text-islamic-gold');
                    els.progressCircle.style.filter = "drop-shadow(0px 4px 8px rgba(217, 119, 6, 0.5))";
                } else {
                    els.progressCircle.classList.remove('text-islamic-gold');
                    els.progressCircle.classList.add('text-islamic-primary');
                    els.progressCircle.style.filter = "drop-shadow(0px 4px 8px rgba(5, 150, 105, 0.4))";
                }
            }
        }

        function applyTheme(themeName) {
            appData.theme = themeName;
            
            // Reset Base Classes
            els.tasbihShell.className = 'transition-all-smooth relative flex flex-col items-center w-full max-w-[320px] mx-auto p-5 py-8 rounded-[3rem]';
            els.lcdScreen.className = 'transition-all-smooth relative w-full max-w-[220px] h-24 rounded-2xl mb-6 flex flex-col items-center justify-center z-10';
            els.counterDisplay.className = 'transition-all-smooth mb-1';
            els.mainBtn.className = 'transition-all-smooth tap-effect relative flex items-center justify-center w-40 h-40 rounded-full outline-none focus:outline-none group z-10';
            els.targetDisplayBox.className = 'transition-all-smooth text-xs font-medium px-4 py-1.5 rounded-full';
            els.progressCircle.style.filter = "none";

            if (themeName === 'modern') {
                els.svgProgress.classList.remove('opacity-0');
                els.physicalResetBtn.classList.add('hidden');
                els.rippleEffect.classList.remove('hidden');
                
                // Modern Typography & Colors (Gradient Text)
                els.counterDisplay.classList.add('text-7xl', 'font-black', 'bg-clip-text', 'text-transparent', 'bg-gradient-to-b', 'from-islamic-primary', 'to-islamic-dark', 'dark:from-emerald-300', 'dark:to-white', 'drop-shadow-sm', 'pb-1');
                els.lcdScreen.classList.add('bg-transparent', 'h-20');
                els.targetDisplayBox.classList.add('text-islamic-dark', 'dark:text-islamic-light', 'bg-islamic-light', 'dark:bg-slate-700/80', 'border', 'border-islamic-primary/20', 'dark:border-slate-600', 'shadow-sm', 'backdrop-blur-sm');
                
                // Modern Shell (Subtle Glassmorphism Container)
                els.tasbihShell.classList.add('bg-white/40', 'dark:bg-slate-800/40', 'backdrop-blur-md', 'shadow-[0_8px_30px_rgb(0,0,0,0.04)]', 'dark:shadow-[0_8px_30px_rgb(0,0,0,0.2)]', 'border', 'border-white', 'dark:border-slate-700/50');
                
                // Elegant 3D Glassy Button (Neumorphism Style)
                els.mainBtn.classList.add('bg-gradient-to-b', 'from-white', 'to-slate-50', 'dark:from-slate-700', 'dark:to-slate-800', 'shadow-[0_15px_35px_-10px_rgba(5,150,105,0.3),inset_0_-4px_10px_rgba(0,0,0,0.05)]', 'dark:shadow-[0_15px_35px_-10px_rgba(0,0,0,0.5),inset_0_-4px_10px_rgba(0,0,0,0.2)]', 'border', 'border-white', 'dark:border-slate-600');
                
                // Set initial progress glow
                if (appData.count < appData.target || appData.target === 0) {
                    els.progressCircle.style.filter = "drop-shadow(0px 4px 8px rgba(5, 150, 105, 0.4))";
                }
            } 
            else {
                // Konfigurasi Tema Fisik Umum
                els.svgProgress.classList.add('opacity-0');
                els.physicalResetBtn.classList.remove('hidden');
                els.rippleEffect.classList.add('hidden');
                
                els.counterDisplay.classList.add('text-7xl', 'font-digital', 'tracking-widest');
                els.lcdScreen.classList.add('lcd-screen-bg', 'lcd-shadow', 'border-4', 'border-black/20');
                els.targetDisplayBox.classList.add('text-black/60', 'font-digital', 'font-bold');
                
                if (themeName === 'fisik-hitam') {
                    els.tasbihShell.classList.add('theme-physical-black', 'shadow-[0_20px_50px_-10px_rgba(0,0,0,0.5)]', 'border-4');
                    els.mainBtn.classList.add('bg-gradient-to-b', 'from-gray-600', 'to-gray-800', 'border-2', 'border-gray-500', 'btn-3d-shadow');
                } 
                else if (themeName === 'fisik-kayu') {
                    els.tasbihShell.classList.add('theme-physical-wood', 'shadow-[0_20px_50px_-10px_rgba(0,0,0,0.5)]', 'border-4');
                    els.mainBtn.classList.add('bg-gradient-to-b', 'from-amber-600', 'to-amber-900', 'border-2', 'border-amber-700', 'btn-3d-shadow');
                }
            }
            updateUI();
            saveToCloud();
        }

        // --- AUDIO & VIBRATION ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function playClickSound(isTargetReached = false) {
            if (appData.soundMode === 0) return;

            // Mode 2: Suara Manusia (Voice)
            if (appData.soundMode === 2) {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel(); // Hentikan suara sebelumnya
                    let textToSpeak = isTargetReached ? 'Alhamdulillah, target tercapai' : els.dzikirSelect.value;
                    const utterance = new SpeechSynthesisUtterance(textToSpeak);
                    utterance.lang = 'id-ID'; // Bahasa Indonesia
                    utterance.rate = 1.3; // Sedikit dicepatkan agar nyaman
                    window.speechSynthesis.speak(utterance);
                }
                return; // Keluar agar tidak memainkan suara mechanical
            }

            // Mode 1: Suara Klik (Mekanik yang Ditingkatkan)
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const time = audioCtx.currentTime;
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (isTargetReached) {
                // Suara melodi ceria saat target tercapai
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(523.25, time); // C5
                oscillator.frequency.setValueAtTime(659.25, time + 0.1); // E5
                oscillator.frequency.setValueAtTime(783.99, time + 0.2); // G5
                
                gainNode.gain.setValueAtTime(0, time);
                gainNode.gain.linearRampToValueAtTime(0.3, time + 0.05);
                gainNode.gain.exponentialRampToValueAtTime(0.001, time + 0.5);
                
                oscillator.start(time);
                oscillator.stop(time + 0.5);
            } else {
                // Suara mechanical click yang realistis (seperti ketukan kayu/plastik)
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(800, time);
                oscillator.frequency.exponentialRampToValueAtTime(50, time + 0.05);
                
                gainNode.gain.setValueAtTime(0.5, time);
                gainNode.gain.exponentialRampToValueAtTime(0.001, time + 0.05);
                
                oscillator.start(time);
                oscillator.stop(time + 0.05);
            }
        }

        function triggerVibration(isTargetReached = false) {
            if (!navigator.vibrate) return;
            if (isTargetReached) navigator.vibrate([100, 50, 100]);
            else navigator.vibrate(30);
        }

        // --- HANDLERS ---
        function handleTap() {
            checkAndResetDates(false); // Cek tanggal diam-diam sebelum nambah
            
            appData.count++;
            appData.daily++;
            appData.weekly++;
            appData.monthly++;
            
            const isTargetReached = appData.count === appData.target;
            
            playClickSound(isTargetReached);
            triggerVibration(isTargetReached);
            updateUI();
            saveToCloud();

            // Auto Reset khusus untuk sesi target
            if (isTargetReached) {
                setTimeout(() => {
                    appData.count = 0;
                    updateUI();
                    saveToCloud();
                }, 600);
            }
        }

        function resetSession() {
            appData.count = 0;
            updateUI();
            saveToCloud();
            triggerVibration(false);
        }

        function showNotif(title, text) {
            els.notifTitle.innerText = title;
            els.notifText.innerText = text;
            els.notifModal.classList.remove('hidden');
            els.notifModal.classList.add('flex');
        }

        // --- EVENT LISTENERS ---
        els.mainBtn.addEventListener('click', handleTap);
        els.mainBtn.addEventListener('touchstart', (e) => { e.preventDefault(); handleTap(); }, {passive: false});
        
        els.btnReset.addEventListener('click', resetSession);
        els.physicalResetBtn.addEventListener('click', resetSession);
        
        els.targetInput.addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            appData.target = val > 0 ? val : 1;
            updateUI();
            saveToCloud();
        });

        els.dzikirSelect.addEventListener('change', () => {
            appData.count = 0; // Reset count on dzikir change
            updateUI();
            saveToCloud();
        });

        els.themeSelect.addEventListener('change', (e) => {
            applyTheme(e.target.value);
        });

        els.btnCloseNotif.addEventListener('click', () => {
            els.notifModal.classList.add('hidden');
            els.notifModal.classList.remove('flex');
        });

        function updateSoundIcon() {
            if (appData.soundMode === undefined) appData.soundMode = 1;
            
            els.iconSoundClick.classList.add('hidden');
            els.iconSoundVoice.classList.add('hidden');
            els.iconSoundOff.classList.add('hidden');

            if (appData.soundMode === 1) els.iconSoundClick.classList.remove('hidden');
            else if (appData.soundMode === 2) els.iconSoundVoice.classList.remove('hidden');
            else els.iconSoundOff.classList.remove('hidden');
        }

        els.btnSound.addEventListener('click', () => {
            // Siklus perubahan: 1 (Klik) -> 2 (Suara Dzikir) -> 0 (Mute)
            appData.soundMode = (appData.soundMode + 1) % 3;
            updateSoundIcon();
            saveToCloud();
            
            // Tes suara saat ikon dipencet
            if (appData.soundMode !== 0) playClickSound();
        });

        // --- START APP ---
        function initApp() {
            checkAndResetDates(true);
            applyTheme(appData.theme); // Apply saved theme
            updateSoundIcon();
            updateUI();
        }

        // Run Firebase Boot
        initFirebase();

    </script>
</body>
</html>
