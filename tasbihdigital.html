<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    
    <title>Tasbih Digital Premium</title>

    <meta name="theme-color" content="#8c52ff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Tasbih">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#8c52ff',
                        secondary: '#d099ff',
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Share+Tech+Mono&display=swap');
        
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-digital { font-family: 'Share Tech Mono', monospace; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d099ff; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #8c52ff; }
        
        * { -webkit-tap-highlight-color: transparent; }

        /* Custom Gradient for text and backgrounds */
        .text-gradient {
            background: linear-gradient(to right, #8c52ff, #d099ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .bg-gradient-feminine {
            background: linear-gradient(135deg, #8c52ff, #d099ff);
        }
        .bg-gradient-splash {
            background: linear-gradient(135deg, #fbcfe8, #f472b6, #d099ff, #8c52ff);
            background-size: 200% 200%;
            animation: gradientMove 5s ease infinite;
        }
        
        /* Custom Animations */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
        @keyframes scaleIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes gradientMove { 
            0% { background-position: 0% 50%; } 
            50% { background-position: 100% 50%; } 
            100% { background-position: 0% 50%; } 
        }
        
        .progress-ring__circle {
            transition: stroke-dashoffset 0.35s ease-out;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        /* 10 Bentuk Tasbih Utilities */
        .shape-diamond { transform: rotate(45deg); }
        .shape-diamond-inner { transform: rotate(-45deg); }
    </style>
</head>
<body class="bg-slate-900 text-slate-50 overflow-x-hidden transition-colors duration-1000">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef, useCallback } = React;

        // --- ICONS ---
        const IconMoon = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>;
        const IconSun = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>;
        const IconSettings = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>;
        const IconVolume2 = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>;
        const IconVolumeX = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>;
        const IconX = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
        const IconUser = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>;
        const IconActivity = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>;
        const IconTarget = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>;
        const IconRefresh = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>;
        const IconCheckCircle = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>;

        // --- 10 BENTUK TASBIH ---
        const SHAPES = [
            { id: 'circle', name: 'Bulat Klasik', class: 'rounded-full w-44 h-44', innerClass: '' },
            { id: 'squircle', name: 'Kotak Ergonomis', class: 'rounded-[2rem] w-44 h-44', innerClass: '' },
            { id: 'dome', name: 'Kubah Elegan', class: 'rounded-t-[4rem] rounded-b-2xl w-44 h-44', innerClass: '' },
            { id: 'leaf', name: 'Daun Teratai', class: 'rounded-tl-[4rem] rounded-br-[4rem] rounded-tr-xl rounded-bl-xl w-44 h-44', innerClass: '' },
            { id: 'diamond', name: 'Berlian Simetris', class: 'rounded-2xl w-40 h-40 shape-diamond', innerClass: 'shape-diamond-inner' },
            { id: 'double', name: 'Cincin Ganda', class: 'rounded-full w-44 h-44 border-8 border-white/40 shadow-[inset_0_0_20px_rgba(255,255,255,0.4)]', innerClass: '' },
            { id: 'pill', name: 'Kapsul Lebar', class: 'rounded-[3rem] w-48 h-36', innerClass: '' },
            { id: '3d', name: 'Dimensi 3D', class: 'rounded-full w-44 h-44 shadow-[inset_0_-15px_20px_rgba(0,0,0,0.15),0_10px_20px_rgba(140,82,255,0.3)]', innerClass: '' },
            { id: 'aura', name: 'Aura Berlapis', class: 'rounded-full w-40 h-40 ring-4 ring-offset-8 ring-offset-primary/20 ring-primary/40', innerClass: '' },
            { id: 'minimal', name: 'Minimalis', class: 'rounded-[2.5rem] w-44 h-44 bg-opacity-70 backdrop-blur-sm border border-white/50', innerClass: '' },
        ];

        // --- UTILS & DATA ---
        const safeGetItem = (key, defaultValue) => {
            try { const item = localStorage.getItem(key); return item !== null ? JSON.parse(item) : defaultValue; } 
            catch (error) { return defaultValue; }
        };
        const safeSetItem = (key, value) => {
            try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
        };

        const getWeekNumber = (d) => {
            d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay()||7));
            const yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
            return Math.ceil(( ( (d - yearStart) / 86400000) + 1)/7);
        };

        const defaultStats = {
            'Subhanallah': { daily: 0, weekly: 0, monthly: 0 },
            'Alhamdulillah': { daily: 0, weekly: 0, monthly: 0 },
            'Allahu Akbar': { daily: 0, weekly: 0, monthly: 0 },
            'La Ilaha Illallah': { daily: 0, weekly: 0, monthly: 0 },
            'Astaghfirullah': { daily: 0, weekly: 0, monthly: 0 },
            'Sholawat Nabi': { daily: 0, weekly: 0, monthly: 0 },
            'Zikir Bebas': { daily: 0, weekly: 0, monthly: 0 },
        };

        const App = () => {
            // --- SPLASH SCREEN STATE ---
            const [showSplash, setShowSplash] = useState(true);
            const [splashFading, setSplashFading] = useState(false);

            // --- STATE: PREFERENCES ---
            const [userName, setUserName] = useState(() => safeGetItem('tasbih_user_name', "Muslimah"));
            const [isDarkMode, setIsDarkMode] = useState(() => safeGetItem('tasbih_dark_mode', false));
            const [audioEnabled, setAudioEnabled] = useState(() => safeGetItem('tasbih_audio', true));
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            const [activeShapeId, setActiveShapeId] = useState(() => safeGetItem('tasbih_shape_id', 'circle'));

            // --- STATE: TASBIH ---
            const [count, setCount] = useState(() => safeGetItem('tasbih_count', 0));
            const [target, setTarget] = useState(() => safeGetItem('tasbih_target', 33));
            const [currentDzikir, setCurrentDzikir] = useState(() => safeGetItem('tasbih_current', 'Subhanallah'));
            const [stats, setStats] = useState(() => {
                const loaded = safeGetItem('tasbih_stats', defaultStats);
                const merged = {...defaultStats};
                for(let key in defaultStats) {
                    if(loaded[key]) merged[key] = loaded[key];
                }
                return merged;
            });
            const [lastDates, setLastDates] = useState(() => safeGetItem('tasbih_dates', { month: -1, week: -1, date: '' }));
            const [showTargetReached, setShowTargetReached] = useState(false);
            const [animatingTap, setAnimatingTap] = useState(false);

            // --- AUDIO CONTEXT ---
            const audioCtxRef = useRef(null);

            // --- THEME DEFINITION (Warna Tetap Sama) ---
            const theme = useMemo(() => ({
                bg: isDarkMode ? 'bg-[#1a1128]' : 'bg-fuchsia-50/50',
                text: isDarkMode ? 'text-fuchsia-50' : 'text-slate-800',
                textMuted: isDarkMode ? 'text-fuchsia-300/70' : 'text-slate-500',
                panel: isDarkMode ? 'bg-[#2d1b4e]/60 border-[#8c52ff]/20 shadow-[0_8px_30px_rgb(0,0,0,0.5)]' : 'bg-white/80 border-fuchsia-200 shadow-[0_8px_30px_rgb(140,82,255,0.06)]',
                inputBg: isDarkMode ? 'bg-[#1a1128]/80 border-[#8c52ff]/30 focus:border-secondary text-white' : 'bg-fuchsia-50 border-fuchsia-200 focus:border-primary text-slate-800',
                card: isDarkMode ? 'bg-[#2d1b4e]/40 border-[#8c52ff]/20 hover:bg-[#2d1b4e]/80' : 'bg-white border-fuchsia-100 hover:shadow-lg',
                circleBg: isDarkMode ? 'stroke-[#8c52ff]/20' : 'stroke-fuchsia-200',
                primaryColor: 'primary',
                secondaryColor: 'secondary'
            }), [isDarkMode]);

            // --- EFFECT: SPLASH SCREEN LOGIC ---
            useEffect(() => {
                const fadeTimer = setTimeout(() => {
                    setSplashFading(true);
                }, 2000); // Mulai fade out setelah 2 detik

                const removeTimer = setTimeout(() => {
                    setShowSplash(false);
                }, 3000); // Hapus dari DOM setelah 3 detik

                return () => { clearTimeout(fadeTimer); clearTimeout(removeTimer); };
            }, []);

            // --- EFFECT: SYNC BODY CLASS ---
            useEffect(() => {
                if (isDarkMode) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
                safeSetItem('tasbih_dark_mode', isDarkMode);
            }, [isDarkMode]);

            // --- EFFECT: CHECK DATE RESET ---
            useEffect(() => {
                const now = new Date();
                const curMonth = now.getMonth();
                const curWeek = getWeekNumber(now);
                const curDate = now.toDateString();

                let changed = false;
                let newStats = { ...stats };

                if (lastDates.month === -1) {
                    setLastDates({ month: curMonth, week: curWeek, date: curDate });
                    safeSetItem('tasbih_dates', { month: curMonth, week: curWeek, date: curDate });
                    return;
                }

                if (lastDates.month !== curMonth) {
                    for (let key in newStats) {
                        newStats[key].daily = 0;
                        newStats[key].weekly = 0;
                        newStats[key].monthly = 0;
                    }
                    changed = true;
                } else {
                    if (lastDates.week !== curWeek) {
                        for (let key in newStats) {
                            newStats[key].daily = 0;
                            newStats[key].weekly = 0;
                        }
                        changed = true;
                    } else if (lastDates.date !== curDate) {
                        for (let key in newStats) {
                            newStats[key].daily = 0;
                        }
                        changed = true;
                    }
                }

                if (changed) {
                    setStats(newStats);
                    safeSetItem('tasbih_stats', newStats);
                }
                
                if (lastDates.date !== curDate) {
                    const newDates = { month: curMonth, week: curWeek, date: curDate };
                    setLastDates(newDates);
                    safeSetItem('tasbih_dates', newDates);
                }
            }, []);

            // --- AUDIO & VIBRATION ---
            const playSound = useCallback((isTargetReached = false) => {
                if (!audioEnabled) return;
                
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!audioCtxRef.current) audioCtxRef.current = new AudioContext();
                const audioCtx = audioCtxRef.current;
                
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const time = audioCtx.currentTime;
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                if (isTargetReached) {
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(523.25, time); // C5
                    oscillator.frequency.setValueAtTime(659.25, time + 0.1); // E5
                    oscillator.frequency.setValueAtTime(783.99, time + 0.2); // G5
                    gainNode.gain.setValueAtTime(0, time);
                    gainNode.gain.linearRampToValueAtTime(0.3, time + 0.05);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, time + 0.5);
                    oscillator.start(time);
                    oscillator.stop(time + 0.5);
                } else {
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(800, time);
                    oscillator.frequency.exponentialRampToValueAtTime(50, time + 0.05);
                    gainNode.gain.setValueAtTime(0.4, time);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, time + 0.05);
                    oscillator.start(time);
                    oscillator.stop(time + 0.05);
                }
            }, [audioEnabled]);

            const triggerVibration = useCallback((isTargetReached = false) => {
                if (!navigator.vibrate) return;
                if (isTargetReached) navigator.vibrate([100, 50, 100]);
                else navigator.vibrate(30);
            }, []);

            // --- EVENT HANDLERS ---
            const handleTap = useCallback((e) => {
                if (e) e.preventDefault();
                
                // Animation Trigger
                setAnimatingTap(true);
                setTimeout(() => setAnimatingTap(false), 150);

                const newCount = count + 1;
                setCount(newCount);
                safeSetItem('tasbih_count', newCount);

                // Update Stats
                setStats(prev => {
                    const dzikirStats = prev[currentDzikir] || { daily: 0, weekly: 0, monthly: 0 };
                    const newStats = {
                        ...prev,
                        [currentDzikir]: {
                            daily: dzikirStats.daily + 1,
                            weekly: dzikirStats.weekly + 1,
                            monthly: dzikirStats.monthly + 1
                        }
                    };
                    safeSetItem('tasbih_stats', newStats);
                    return newStats;
                });

                const isReached = newCount === target;
                playSound(isReached);
                triggerVibration(isReached);

                if (isReached) {
                    setShowTargetReached(true);
                    setTimeout(() => setShowTargetReached(false), 2500);
                    setTimeout(() => {
                        setCount(0);
                        safeSetItem('tasbih_count', 0);
                    }, 600);
                }
            }, [count, target, currentDzikir, playSound, triggerVibration]);

            const resetSession = () => {
                setCount(0);
                safeSetItem('tasbih_count', 0);
                triggerVibration(false);
            };

            const resetAllStats = () => {
                if(window.confirm("Apakah Anda yakin ingin menghapus semua data statistik zikir?")) {
                    setStats(defaultStats);
                    setCount(0);
                    safeSetItem('tasbih_stats', defaultStats);
                    safeSetItem('tasbih_count', 0);
                    setIsSettingsOpen(false);
                }
            };

            // Menutup Modal jika klik area backdrop (di luar panel)
            const handleCloseModal = (e) => {
                if (e.target.id === 'modal-backdrop') {
                    setIsSettingsOpen(false);
                }
            };

            // Progress Circle Calculation
            const radius = 46;
            const circumference = 2 * Math.PI * radius;
            const percent = target > 0 ? Math.min((count / target) * 100, 100) : 0;
            const strokeDashoffset = circumference - (percent / 100) * circumference;

            // Get Active Shape
            const activeShape = SHAPES.find(s => s.id === activeShapeId) || SHAPES[0];

            return (
                <div className={`min-h-screen transition-colors duration-1000 ${theme.bg} ${theme.text} font-sans pb-10 flex flex-col`}>
                    
                    {/* --- SPLASH SCREEN --- */}
                    {showSplash && (
                        <div className={`fixed inset-0 z-[200] flex flex-col items-center justify-center bg-gradient-splash transition-opacity duration-1000 ${splashFading ? 'opacity-0' : 'opacity-100'}`}>
                            {/* Logo Google Drive */}
                            <img 
                                src="https://lh3.googleusercontent.com/d/1HMSu1rIUBGKu1HWaxicN66rQp_sS24PG" 
                                alt="Logo Tasbih" 
                                className="w-40 h-40 object-contain animate-pulse-slow drop-shadow-2xl mb-6"
                                onError={(e) => { e.target.style.display = 'none'; }} // Jika gambar gagal muat
                            />
                            <h1 className="text-3xl font-extrabold text-white tracking-widest drop-shadow-lg">
                                TASBIH
                            </h1>
                            <p className="text-white/90 font-medium tracking-[0.3em] text-sm mt-1">
                                PREMIUM
                            </p>
                        </div>
                    )}

                    {/* --- HEADER --- */}
                    <div className="pt-6 md:pt-10 px-4 max-w-4xl mx-auto w-full flex justify-between items-center z-20">
                        <div className="flex items-center gap-2">
                            <div className="w-10 h-10 rounded-xl bg-gradient-feminine shadow-[0_4px_15px_rgb(140,82,255,0.4)] flex items-center justify-center text-white">
                                <IconActivity className="w-5 h-5" />
                            </div>
                            <div>
                                <h1 className="font-bold text-lg leading-tight text-gradient">Tasbih Premium</h1>
                                <p className={`text-[10px] md:text-xs ${theme.textMuted}`}>Fokus & Ikhlas</p>
                            </div>
                        </div>

                        <div className="flex gap-2">
                            <button onClick={() => setAudioEnabled(!audioEnabled)} className={`p-2.5 rounded-full backdrop-blur-md transition-all shadow-md hover:scale-105 ${isDarkMode ? 'bg-[#2d1b4e]/80 text-secondary hover:bg-[#2d1b4e]' : 'bg-white/90 text-primary hover:bg-fuchsia-100'}`}>
                                {audioEnabled ? <IconVolume2 className="w-5 h-5" /> : <IconVolumeX className="w-5 h-5" />}
                            </button>
                            <button onClick={() => setIsDarkMode(!isDarkMode)} className={`p-2.5 rounded-full backdrop-blur-md transition-all shadow-md hover:scale-105 ${isDarkMode ? 'bg-[#2d1b4e]/80 text-secondary hover:bg-[#2d1b4e]' : 'bg-white/90 text-primary hover:bg-fuchsia-100'}`}>
                                {isDarkMode ? <IconSun className="w-5 h-5" /> : <IconMoon className="w-5 h-5" />}
                            </button>
                            <button onClick={() => setIsSettingsOpen(true)} className={`p-2.5 rounded-full backdrop-blur-md transition-all shadow-md hover:scale-105 ${isDarkMode ? 'bg-[#2d1b4e]/80 text-secondary hover:bg-[#2d1b4e]' : 'bg-white/90 text-primary hover:bg-fuchsia-100'}`}>
                                <IconSettings className="w-5 h-5" />
                            </button>
                        </div>
                    </div>

                    {/* --- MAIN CONTENT --- */}
                    <main className="flex-1 w-full max-w-md mx-auto mt-6 md:mt-10 px-4 flex flex-col relative z-10">
                        
                        <div className="text-center mb-6">
                            {userName && (
                                <p className={`font-semibold mb-1 text-sm md:text-base ${isDarkMode ? 'text-secondary' : 'text-primary'}`}>
                                    Assalamu'alaikum, {userName} ✨
                                </p>
                            )}
                        </div>

                        {/* Controls Panel (Target & Dzikir) */}
                        <div className={`${theme.panel} backdrop-blur-md rounded-2xl p-4 md:p-5 mb-8 border flex items-center justify-between gap-3 relative z-20`}>
                            <div className="flex-1">
                                <label className={`block text-[10px] uppercase tracking-wider font-semibold ${theme.textMuted} mb-1 ml-1`}>Jenis Zikir</label>
                                <select 
                                    value={currentDzikir}
                                    onChange={(e) => { 
                                        setCurrentDzikir(e.target.value); 
                                        safeSetItem('tasbih_current', e.target.value);
                                        setCount(0); 
                                        safeSetItem('tasbih_count', 0);
                                    }}
                                    className={`w-full ${theme.inputBg} rounded-xl px-3 py-2 text-sm font-semibold appearance-none border-transparent outline-none transition-all cursor-pointer`}
                                >
                                    {Object.keys(defaultStats).map(dzikir => (
                                        <option key={dzikir} value={dzikir}>{dzikir}</option>
                                    ))}
                                </select>
                            </div>
                            <div className="w-24 shrink-0">
                                <label className={`block text-[10px] uppercase tracking-wider font-semibold ${theme.textMuted} mb-1 ml-1 flex items-center gap-1`}><IconTarget className="w-3 h-3"/> Target</label>
                                <div className={`relative ${theme.inputBg} rounded-xl border-transparent flex items-center overflow-hidden`}>
                                    <input 
                                        type="number" 
                                        min="1"
                                        value={target}
                                        onChange={(e) => {
                                            const val = parseInt(e.target.value) || 1;
                                            setTarget(val);
                                            safeSetItem('tasbih_target', val);
                                        }}
                                        className={`w-full bg-transparent px-2 py-2 text-sm font-bold text-center focus:outline-none`}
                                    />
                                </div>
                            </div>
                        </div>

                        {/* Tasbih Main Tap Area */}
                        <div className={`${theme.panel} backdrop-blur-md rounded-[3rem] p-8 pb-10 flex flex-col items-center justify-center relative border shadow-2xl overflow-hidden`}>
                            {/* Decorative Blobs */}
                            <div className="absolute -top-20 -right-20 w-48 h-48 bg-primary/10 rounded-full blur-3xl pointer-events-none"></div>
                            <div className="absolute -bottom-20 -left-20 w-48 h-48 bg-secondary/10 rounded-full blur-3xl pointer-events-none"></div>
                            
                            {/* Target Notification Overlay */}
                            <div className={`absolute top-4 left-0 w-full flex justify-center transition-all duration-500 z-30 ${showTargetReached ? 'opacity-100 translate-y-0' : 'opacity-0 -translate-y-4 pointer-events-none'}`}>
                                <div className="bg-gradient-feminine text-white px-4 py-1.5 rounded-full text-xs font-bold shadow-lg flex items-center gap-1.5 animate-bounce">
                                    <IconCheckCircle className="w-4 h-4"/> Target Tercapai!
                                </div>
                            </div>

                            {/* Reset Button */}
                            <button 
                                onClick={resetSession}
                                className={`absolute top-6 right-6 p-2 rounded-full backdrop-blur-sm transition-all hover:rotate-180 z-20 ${isDarkMode ? 'bg-[#1a1128]/50 text-fuchsia-300 hover:text-white' : 'bg-fuchsia-100/50 text-primary hover:bg-fuchsia-200'}`}
                                title="Reset Penghitung"
                            >
                                <IconRefresh className="w-4 h-4" />
                            </button>

                            {/* Count Display */}
                            <div className="h-24 flex items-end justify-center mb-6 relative z-10">
                                <span className="text-7xl md:text-8xl font-bold font-digital tracking-tighter text-gradient drop-shadow-sm leading-none">
                                    {count}
                                </span>
                            </div>

                            {/* Progress Ring & Dynamic Shape Button */}
                            <div className="relative w-[220px] h-[220px] flex items-center justify-center z-10">
                                {/* SVG Ring (Selalu di luar membingkai bentuk di dalam) */}
                                <svg className="absolute inset-0 w-full h-full pointer-events-none" viewBox="0 0 100 100">
                                    <circle 
                                        cx="50" cy="50" r={radius} 
                                        fill="none" strokeWidth="3" 
                                        className={theme.circleBg} 
                                    />
                                    <circle 
                                        cx="50" cy="50" r={radius} 
                                        fill="none" strokeWidth="4" strokeLinecap="round" 
                                        className="stroke-primary progress-ring__circle" 
                                        style={{
                                            strokeDasharray: circumference,
                                            strokeDashoffset: strokeDashoffset,
                                            filter: isDarkMode ? 'drop-shadow(0px 0px 8px rgba(140,82,255,0.6))' : 'drop-shadow(0px 4px 6px rgba(140,82,255,0.3))'
                                        }}
                                    />
                                </svg>

                                {/* Main Tap Button - Dynamic Shape */}
                                <button 
                                    onClick={handleTap}
                                    onTouchStart={handleTap}
                                    className={`relative bg-gradient-feminine text-white flex items-center justify-center overflow-hidden group outline-none select-none touch-manipulation transform transition-all duration-200 ${animatingTap ? 'scale-95 shadow-inner' : 'scale-100 shadow-[0_15px_35px_rgba(140,82,255,0.4)]'} ${activeShape.class}`}
                                >
                                    {/* Ripple Layer */}
                                    <div className={`absolute inset-0 bg-white/20 transition-opacity duration-150 ${animatingTap ? 'opacity-100' : 'opacity-0'}`}></div>
                                    
                                    {/* Inner Text with optional counter-rotation */}
                                    <span className={`text-2xl font-bold tracking-widest uppercase opacity-90 drop-shadow-md z-10 ${activeShape.innerClass}`}>
                                        TAP
                                    </span>
                                </button>
                            </div>
                        </div>

                    </main>

                    {/* --- STATISTICS SECTION --- */}
                    <div className="w-full max-w-md mx-auto px-4 mt-8 relative z-10">
                        <div className="flex items-center justify-between mb-4 px-1">
                            <h3 className={`text-sm md:text-base font-bold ${theme.text} text-gradient`}>
                                Statistik: {currentDzikir}
                            </h3>
                        </div>
                        <div className="grid grid-cols-3 gap-3 md:gap-4">
                            <div className={`${theme.card} backdrop-blur-sm rounded-2xl p-3 md:p-4 text-center transition-all duration-300 border`}>
                                <span className={`block text-[10px] uppercase tracking-wider font-semibold ${theme.textMuted} mb-1`}>Hari Ini</span>
                                <span className="text-xl md:text-2xl font-bold font-digital text-primary">{stats[currentDzikir]?.daily || 0}</span>
                            </div>
                            <div className={`${theme.card} backdrop-blur-sm rounded-2xl p-3 md:p-4 text-center transition-all duration-300 border`}>
                                <span className={`block text-[10px] uppercase tracking-wider font-semibold ${theme.textMuted} mb-1`}>Pekan Ini</span>
                                <span className="text-xl md:text-2xl font-bold font-digital text-primary">{stats[currentDzikir]?.weekly || 0}</span>
                            </div>
                            <div className={`${isDarkMode ? 'bg-primary/20 border-primary/30' : 'bg-fuchsia-100 border-secondary'} rounded-2xl p-3 md:p-4 text-center transition-all duration-300 border shadow-inner`}>
                                <span className={`block text-[10px] uppercase tracking-wider font-bold ${isDarkMode ? 'text-secondary' : 'text-primary'} mb-1`}>Bulan Ini</span>
                                <span className="text-xl md:text-2xl font-bold font-digital text-gradient">{stats[currentDzikir]?.monthly || 0}</span>
                            </div>
                        </div>
                        <p className={`text-[10px] mt-4 text-center ${theme.textMuted} flex items-center justify-center gap-1 opacity-80`}>
                            <IconActivity className="w-3 h-3" /> Data direset otomatis sesuai periode berjalan.
                        </p>
                    </div>

                    {/* --- MODAL SETTINGS (10 BENTUK & PENGATURAN) --- */}
                    {isSettingsOpen && (
                        <div 
                            id="modal-backdrop"
                            onClick={handleCloseModal}
                            className="fixed inset-0 z-50 flex items-center justify-center bg-[#1a1128]/80 backdrop-blur-sm p-4 animate-[fadeIn_0.2s_ease-out_forwards] cursor-pointer"
                        >
                            <div className={`${theme.panel} border w-full max-w-md rounded-3xl p-6 relative shadow-2xl animate-[scaleIn_0.2s_ease-out_forwards] overflow-hidden max-h-[90vh] overflow-y-auto cursor-default`}>
                                {/* Abstract Decoration */}
                                <div className="absolute -top-32 -right-32 w-64 h-64 bg-primary/20 rounded-full blur-3xl pointer-events-none"></div>
                                <div className="absolute -bottom-32 -left-32 w-64 h-64 bg-secondary/20 rounded-full blur-3xl pointer-events-none"></div>

                                {/* Tombol Tutup Maksimal */}
                                <button 
                                    onClick={() => setIsSettingsOpen(false)} 
                                    className={`absolute top-4 right-4 p-2 rounded-full hover:bg-fuchsia-500/20 transition-colors z-20 ${theme.text}`}
                                >
                                    <IconX className="w-6 h-6" />
                                </button>

                                <h2 className={`text-xl font-bold mb-6 flex items-center gap-2 text-gradient border-b ${theme.border} pb-3 relative z-10`}>
                                    <IconSettings className="w-6 h-6 text-primary" /> Pengaturan
                                </h2>

                                <div className="space-y-5 relative z-10">
                                    {/* IDENTITAS */}
                                    <div>
                                        <h3 className={`font-semibold ${theme.text} mb-2 flex items-center gap-2 text-sm`}><IconUser className="w-4 h-4 text-primary" /> Nama Pengguna</h3>
                                        <input 
                                            type="text" value={userName} 
                                            onChange={(e) => { setUserName(e.target.value); safeSetItem('tasbih_user_name', e.target.value); }}
                                            className={`w-full ${theme.inputBg} rounded-xl px-4 py-2 border text-sm focus:ring-2 focus:ring-primary/50 outline-none transition-all`}
                                            placeholder="Masukkan Nama Anda"
                                        />
                                    </div>

                                    {/* TEMA BENTUK TASBIH (10 OPSI) */}
                                    <div className={`p-4 rounded-xl border ${theme.border} bg-fuchsia-500/5`}>
                                        <h3 className={`font-semibold ${theme.text} mb-3 flex items-center gap-2 text-sm`}>
                                            <IconActivity className="w-4 h-4 text-primary" /> 10 Bentuk Tasbih
                                        </h3>
                                        <div className="grid grid-cols-2 gap-2">
                                            {SHAPES.map(shape => (
                                                <button
                                                    key={shape.id}
                                                    onClick={() => { setActiveShapeId(shape.id); safeSetItem('tasbih_shape_id', shape.id); }}
                                                    className={`py-2 px-3 text-xs md:text-sm rounded-lg font-medium transition-all text-left border ${
                                                        activeShapeId === shape.id 
                                                        ? 'bg-gradient-feminine text-white shadow-md border-transparent' 
                                                        : `${isDarkMode ? 'bg-[#1a1128] text-slate-300 border-primary/20 hover:bg-[#2d1b4e]' : 'bg-white text-slate-600 border-fuchsia-200 hover:bg-fuchsia-50'}`
                                                    }`}
                                                >
                                                    {shape.name}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {/* SUARA & GETARAN */}
                                    <div className={`p-4 rounded-xl border ${theme.border} bg-fuchsia-500/5`}>
                                        <div className="flex justify-between items-center">
                                            <h3 className={`font-semibold ${theme.text} flex items-center gap-2 text-sm`}>
                                                {audioEnabled ? <IconVolume2 className="w-4 h-4 text-primary" /> : <IconVolumeX className="w-4 h-4 text-rose-500" />} 
                                                Suara & Getaran
                                            </h3>
                                            <label className="relative inline-flex items-center cursor-pointer">
                                                <input type="checkbox" className="sr-only peer" checked={audioEnabled} onChange={(e) => { setAudioEnabled(e.target.checked); safeSetItem('tasbih_audio', e.target.checked); }} />
                                                <div className="w-10 h-5 bg-slate-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-primary"></div>
                                            </label>
                                        </div>
                                        <p className={`text-[10px] mt-1.5 ${theme.textMuted}`}>Mainkan suara saat tap dan capai target.</p>
                                    </div>

                                    {/* RESET DATA */}
                                    <div className={`p-4 rounded-xl border border-rose-500/30 bg-rose-500/5 mt-6`}>
                                        <h3 className={`font-semibold text-rose-500 flex items-center gap-2 text-sm mb-2`}>
                                            <IconRefresh className="w-4 h-4" /> Reset Data
                                        </h3>
                                        <p className={`text-[10px] mb-3 ${theme.textMuted}`}>Hapus semua riwayat statistik zikir (harian, pekanan, bulanan).</p>
                                        <button onClick={resetAllStats} className="w-full bg-rose-500 hover:bg-rose-600 text-white font-semibold py-2 rounded-xl text-xs transition-colors shadow-sm">
                                            Reset Semua Statistik
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
